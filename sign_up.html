<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css">
    <title>Sign Up</title>
  </head>
  <body>
    <h1>Create an Account</h1>
    
    <label for="sgnup-usrnm">Username</label><br>
    <input type="text" id="sgnup-usrnm" placeholder="Username..."><br><br>

    <!-- Recovery Email Field -->
    <label for="sgnup-email">Recovery Email</label><br>
    <input type="email" id="sgnup-email" placeholder="Recovery Email..."><br><br>

    <label for="sgnup-psswrd">Password</label><br>
    <input type="password" id="sgnup-psswrd" placeholder="Password..."><br><br>

    <button type="button" id="sgnup-btn">Sign Up</button><br><br>
    <button type="button" onclick="location.href='index.html'">Home</button>

    <script src="script.js"></script>
  </body>
</html>
